version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: defectsync-postgres
    environment:
      POSTGRES_DB: defectsync
      POSTGRES_USER: defectsync
      POSTGRES_PASSWORD: defectsync_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - defectsync-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defectsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: defectsync-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - defectsync-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: defectsync-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - defectsync-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  createbuckets:
    image: minio/mc
    container_name: defectsync-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/images;
      mc mb --ignore-existing myminio/ifc-models;
      mc mb --ignore-existing myminio/fragments;
      mc mb --ignore-existing myminio/reports;
      mc anonymous set download myminio/images;
      echo 'Buckets created successfully';
      exit 0;
      "
    networks:
      - defectsync-net

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  defectsync-net:
    driver: bridge
