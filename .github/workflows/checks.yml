name: Project checks
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: audit_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: defectsync_test
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U audit_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://audit_test:test-only@127.0.0.1:55432/defectsync_test
      DATABASE_URL: postgresql+asyncpg://audit_test:test-only@127.0.0.1:55432/defectsync_test
      DATABASE_URL_SYNC: postgresql+psycopg://audit_test:test-only@127.0.0.1:55432/defectsync_test
      APP_ENV: test
      JWT_SECRET_KEY: test-only-secret-not-for-production-12345
      YOLO_CONFIG_DIR: /tmp/ultralytics
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest tests -q
